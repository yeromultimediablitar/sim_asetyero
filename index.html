<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://script.google.com https://*.googleusercontent.com; connect-src 'self'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#0f2742">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIM Karyawan">
  <title>SIM Karyawan &amp; Aset</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bingkai aplikasi dibuat oleh app.js (agar bisa diulang dengan mode lain bila gagal). -->

  <div id="layar-muat" class="layar" role="status" aria-live="polite">
    <img class="logo" src="icons/icon-192.png" alt="" width="84" height="84">
    <p class="judul-muat">SIM Karyawan &amp; Aset</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="teks-kecil">Memuat aplikasi...</p>
  </div>

  <div id="layar-pesan" class="layar" role="alert" hidden>
    <img class="logo" src="icons/icon-192.png" alt="" width="72" height="72">
    <h1 id="pesan-judul"></h1>
    <p id="pesan-isi"></p>
    <div class="aksi">
      <button id="btn-coba" type="button" class="tombol">Coba lagi</button>
      <a id="link-langsung" class="tautan" target="_blank" rel="noopener noreferrer" hidden>Buka tanpa PWA</a>
    </div>
  </div>

  <div id="bar-masalah" class="bar" hidden role="alert">
    <span>Aplikasi tidak tampil?</span>
    <button id="btn-langsung-sekali" type="button" class="tombol kecil">Buka langsung</button>
    <button id="btn-langsung-selalu" type="button" class="tombol kecil sekunder">Selalu buka langsung</button>
    <button id="btn-tutup-masalah" type="button" class="tombol kecil sekunder" aria-label="Tutup">Tutup</button>
  </div>

  <div id="bar-pasang" class="bar" hidden>
    <span id="teks-pasang">Pasang aplikasi ini di layar utama.</span>
    <button id="btn-pasang" type="button" class="tombol kecil" hidden>Pasang</button>
    <button id="btn-tutup-pasang" type="button" class="tombol kecil sekunder" aria-label="Tutup">Nanti</button>
  </div>

  <div id="bar-update" class="bar" hidden>
    <span>Versi baru aplikasi tersedia.</span>
    <button id="btn-update" type="button" class="tombol kecil">Muat ulang</button>
  </div>

  <noscript><p class="noscript">Aplikasi ini memerlukan JavaScript.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
